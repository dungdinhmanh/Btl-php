<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Khôi phục mật khẩu - TNC Store</title>
		<!-- Nhúng Bootstrap để đồng bộ giao diện với web chính -->
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
	</head>
	<body class="bg-light d-flex justify-content-center align-items-center vh-100">
		<div class="card p-4 shadow" style="width: 400px">
			<h3 class="text-center mb-3">Quên mật khẩu</h3>
			<p class="text-muted small text-center">
				Nhập email của bạn để nhận mã xác nhận đặt lại mật khẩu.
			</p>

			<form>
				<div class="mb-3">
					<label for="email" class="form-label">Email đăng ký</label>
					<input
						type="email"
						class="form-control"
						id="email"
						placeholder="name@example.com"
						required
					/>
				</div>
				<button type="submit" class="btn btn-primary w-100 mb-3">Gửi yêu cầu</button>
				<div class="text-center">
					<a href="index.html" class="text-decoration-none small">Quay lại trang chủ</a>
				</div>
			</form>
		</div>
	</body>
</html>
