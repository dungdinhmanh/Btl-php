<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sản phẩm | TNC Store</title>
		<link rel="stylesheet" href="css/style.css" />
		<link rel="icon" href="assets/favicon.png" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
		/>
		<script defer src="js/header.js"></script>
	</head>
	<body>
		<header class="site-header">
			<div class="container">
				<nav class="navbar navbar-expand-lg py-3" aria-label="Main navigation">
					<a class="navbar-brand logo" href="index.html">
						<img src="assets/img/branding/tnc.png" alt="TNC Store" />
					</a>
					<button
						class="navbar-toggler"
						type="button"
						data-bs-toggle="collapse"
						data-bs-target="#storeNavigation"
						aria-label="Toggle navigation"
					>
						<span class="navbar-toggler-icon"></span>
					</button>
					<div class="collapse navbar-collapse" id="storeNavigation">
						<form
							class="search-form mx-lg-4 my-3 my-lg-0"
							role="search"
							action="products.html"
						>
							<input
								class="form-control"
								type="search"
								name="q"
								placeholder="Bạn đang tìm gì?"
								aria-label="Search products"
							/>
							<button class="search-button" type="submit" aria-label="Search">
								<i class="bi bi-search"></i>
							</button>
						</form>
						<div class="header-actions ms-lg-auto">
							<a class="header-action header-button" href="index.html#accountModal">
								<i class="bi bi-person-circle"></i>
								<span>Tài khoản</span>
							</a>
							<a class="header-action cart-action" href="cart.html">
								<span class="cart-icon">
									<i class="bi bi-cart3"></i>
									<b>0</b>
								</span>
								<span>Giỏ hàng</span>
							</a>
						</div>
					</div>
				</nav>
			</div>
		</header>
		<main>
			<section class="section-space">
				<div class="container">
					<div class="row g-4">
						<aside class="col-lg-3">
							<div class="filter-panel">
								<h2>Bộ lọc</h2>
								<label class="filter-check">
									<input
										type="checkbox"
										value="components"
										data-category-filter
									/>
									PC & Linh kiện
									<span data-category-count="components">0</span>
								</label>
								<label class="filter-check">
									<input type="checkbox" value="keyboard" data-category-filter />
									Bàn phím
									<span data-category-count="keyboard">0</span>
								</label>
								<label class="filter-check">
									<input type="checkbox" value="monitor" data-category-filter />
									Màn hình
									<span data-category-count="monitor">0</span>
								</label>
								<label class="filter-check">
									<input type="checkbox" value="gaming" data-category-filter />
									Gaming gear
									<span data-category-count="gaming">0</span>
								</label>
								<hr />
								<label for="sort-price" class="filter-label">Sắp xếp theo</label>
								<select id="sort-price" class="form-select">
									<option>Nổi bật nhất</option>
									<option>Giá thấp đến cao</option>
									<option>Giá cao đến thấp</option>
								</select>
							</div>
						</aside>
						<div class="col-lg-9">
							<div class="row g-4" id="product-grid">
								<!-- Rendered dynamically from CSV -->
								<div class="col-12 py-5 text-center text-muted">
									<div
										class="spinner-border spinner-border-sm me-2"
										role="status"
									></div>
									Đang nạp danh sách sản phẩm...
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
		</main>
		<footer class="site-footer">
			<div class="container">
				<div class="row g-4">
					<div class="col-lg-5">
						<a class="logo" href="index.html">
							<img src="assets/img/branding/tnc.png" alt="TNC Store" />
						</a>
						<p>Thiết bị công nghệ chọn lọc cho những người luôn muốn làm tốt hơn.</p>
					</div>
					<div class="col-6 col-lg-2">
						<h3>Khám phá</h3>
						<a href="products.html">Sản phẩm</a>
						<a href="about.html">Về TNC</a>
						<a href="contact.html">Liên hệ</a>
					</div>
					<div class="col-6 col-lg-2">
						<h3>Hỗ trợ</h3>
						<a href="cart.html">Giỏ hàng</a>
						<a href="payment.html">Thanh toán</a>
						<a href="404.html">Tra cứu đơn</a>
					</div>
					<div class="col-lg-3">
						<h3>Đăng ký nhận tin</h3>
						<p>Ưu đãi mới, cập nhật sản phẩm mới mỗi tuần.</p>
						<form class="newsletter">
							<input
								type="email"
								placeholder="Email của bạn"
								aria-label="Email của bạn"
							/>
							<button type="submit" aria-label="Subscribe">
								<i class="bi bi-arrow-right"></i>
							</button>
						</form>
					</div>
				</div>
				<div class="footer-bottom">
					© 2026 TNC Store
					<a href="admin.html">Quản trị viên</a>
				</div>
			</div>
		</footer>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
		<script src="js/csv-parser.js"></script>
		<script src="js/products.js"></script>
		<script src="js/cart.js"></script>
	</body>
</html>
